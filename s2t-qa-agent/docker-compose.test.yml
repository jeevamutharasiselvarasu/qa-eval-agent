# Isolated test stack: a throwaway PostgreSQL (data in tmpfs) + a test-runner container on an internal network.
# Completely separate from docker-compose.yml (own project name, database, network and volumes).
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
name: s2t-qa-tests

services:
  test-db:
    image: ${TEST_DB_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: qa_test
      POSTGRES_USER: qa_test
      POSTGRES_PASSWORD: qa_test_only   # test-only credential; this database never leaves the internal network
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qa_test -d qa_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [testnet]

  tests:
    image: s2t-qa-tests:latest
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        PYTHON_IMAGE: ${TEST_PYTHON_IMAGE:-python:3.13-slim}
    environment:
      QA_TEST_DATABASE_URL: postgresql+psycopg://qa_test:qa_test_only@test-db:5432/qa_test
      PYTEST_ADDOPTS: ${PYTEST_ADDOPTS:-}
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./test-results:/results
    networks: [testnet]

networks:
  testnet:
    internal: true   # no internet access during the test run (Jira and the LLM are mocked)
